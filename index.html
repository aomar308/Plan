<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<title>Q4 measurements plan</title>
<style>
  :root{
    --bg:#EEF1F4; --card:#FFFFFF; --ink:#14202B; --muted:#5A6774; --line:#D3DAE1; --soft:#E4EAF0;
    --brand:#0E5A8A; --brand-ink:#FFFFFF;
    --flag:#FFD200; --flag-ink:#2B2300; --flag-soft:#FFF1A6;
    --trip:#DCEBF6; --trip-ink:#0C4468; --bad:#B3261E;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0E151B; --card:#17212A; --ink:#E9EEF2; --muted:#9AA8B5; --line:#2B3946; --soft:#223039;
      --brand:#5BB1E6; --brand-ink:#06202F; --flag-soft:#4D4200;
      --trip:#1C3A50; --trip-ink:#BFE0F5; --bad:#FF8A80;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  button{font:inherit; color:inherit; cursor:pointer}
  :focus-visible{outline:3px solid var(--brand); outline-offset:2px}

  header{
    position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  }
  .bar{display:flex; align-items:center; justify-content:space-between; gap:12px}
  h1{margin:0; font-size:20px; line-height:1.2; font-weight:750; letter-spacing:-.01em}
  #status{margin:2px 0 0; font-size:13px; color:var(--muted)}
  #status.offline{color:var(--bad)}
  .btn{min-height:44px; padding:0 16px; border-radius:8px; border:1px solid var(--line); background:transparent; font-weight:600}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:var(--brand-ink)}

  #pills{
    display:flex; gap:8px; margin:10px -14px 0; padding:2px 14px 4px;
    overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none;
  }
  #pills::-webkit-scrollbar{display:none}
  .pill{
    flex:none; scroll-snap-align:center; min-height:44px; padding:0 16px; border-radius:999px;
    border:1.5px solid var(--line); background:transparent; font-weight:650;
    display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .pill[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:var(--brand-ink)}
  .dot{
    min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--flag); color:var(--flag-ink);
    font-size:13px; font-weight:800; display:inline-flex; align-items:center; justify-content:center;
  }

  main{max-width:760px; margin:0 auto; padding:14px 14px 48px}
  .preview{font-size:13px; color:var(--muted); background:var(--soft); border-radius:6px; padding:8px 12px; margin:0 0 12px}
  .notice{
    background:var(--flag-soft); border-left:6px solid var(--flag); border-radius:6px; padding:12px 14px; margin-bottom:14px;
    display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;
  }
  .notice p{margin:0; font-weight:600}
  .notice small{display:block; font-weight:400; color:var(--muted)}
  .seg{display:inline-flex; border:1.5px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:6px}
  .seg button{min-height:40px; padding:0 13px; border:0; background:transparent; font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}

  h2.month{margin:20px 0 8px; font-size:15px; font-weight:700; color:var(--muted)}

  .day{
    display:grid; grid-template-columns:64px 1fr; gap:14px; align-items:start;
    background:var(--card); border:1px solid var(--line); border-left:6px solid var(--line);
    border-radius:10px; padding:10px 12px 10px 10px; margin:0 0 10px;
  }
  .day.changed{border-left-color:var(--flag)}
  .day.past{opacity:.55}
  .when{background:var(--soft); border-radius:8px; text-align:center; padding:8px 0 7px; line-height:1.15}
  .when .wd,.when .mo{display:block; font-size:13px; color:var(--muted); font-weight:600}
  .when .num{display:block; font-size:26px; font-weight:800; font-variant-numeric:tabular-nums}
  .day.today{border-color:var(--brand); border-left-color:var(--brand); border-width:2px; border-left-width:6px}
  .day.today .when{background:var(--brand); color:var(--brand-ink)}
  .day.today .when .wd,.day.today .when .mo{color:inherit; opacity:.85}
  .day.today.changed{border-left-color:var(--flag)}

  .row + .row{margin-top:12px; padding-top:10px; border-top:1px solid var(--line)}
  .who{font-size:13px; font-weight:650; color:var(--muted); margin-bottom:3px}
  .items{display:flex; flex-direction:column; gap:6px; align-items:flex-start}
  .site strong{display:block; font-size:18px; line-height:1.25; font-weight:750; overflow-wrap:anywhere}
  .today .site strong{font-size:22px}
  .meta{display:inline-block; margin-right:10px; font-size:13px; color:var(--muted)}
  .chip{display:inline-block; padding:3px 10px; border-radius:6px; font-size:15px; font-weight:600}
  .chip.trip{background:var(--trip); color:var(--trip-ink)}
  .chip.off{background:var(--soft); color:var(--muted)}
  .note{font-size:15px; color:var(--ink); border-left:3px solid var(--line); padding-left:8px}
  .none{color:var(--muted); font-size:15px}
  .flagline{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:6px}
  .tag{background:var(--flag); color:var(--flag-ink); font-size:13px; font-weight:800; padding:2px 8px; border-radius:4px}
  .was{font-size:13px; color:var(--muted); text-decoration:line-through; overflow-wrap:anywhere}

  .gap{margin:0 0 10px; padding:2px 4px 2px 80px; font-size:14px; color:var(--muted)}
  .empty{padding:28px 8px; text-align:center; color:var(--muted)}
  .empty strong{display:block; color:var(--ink); font-size:18px; margin-bottom:4px}
  .empty .btn{margin-top:14px}

  .locked header,.locked main{display:none}
  #gate{min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px}
  #gate[hidden]{display:none}
  .gate-box{width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px}
  .gate-box h1{font-size:22px; margin-bottom:6px}
  .gate-box p{margin:0 0 16px; color:var(--muted)}
  .gate-box label{display:block; font-size:14px; font-weight:600; margin-bottom:6px}
  .gate-box input{
    width:100%; min-height:48px; padding:0 12px; font:inherit; font-size:18px; color:var(--ink);
    background:var(--bg); border:1.5px solid var(--line); border-radius:8px; margin-bottom:14px;
  }
  .gate-box .btn{width:100%}
  #gate-err{margin:12px 0 0; color:var(--bad); font-weight:600; min-height:1.4em}

  .tabs{display:flex; gap:4px; margin:8px -14px 0; padding:0 14px; border-bottom:1px solid var(--line)}
  .tab{min-height:44px; padding:0 16px; background:transparent; border:0; border-bottom:3px solid transparent; margin-bottom:-1px; font-weight:650; color:var(--muted)}
  .tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--brand)}
  .stat-hero{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:6px}
  .stat-hero .big{font-size:40px; line-height:1.05; font-weight:800; font-variant-numeric:tabular-nums}
  .stat-hero .big small{font-size:18px; font-weight:600; color:var(--muted)}
  .stat-hero p{margin:4px 0 12px; color:var(--muted)}
  .meter{height:12px; background:var(--soft); border-radius:6px; overflow:hidden}
  .meter span{display:block; height:100%; background:var(--brand); border-radius:6px}
  .nums{display:flex; gap:20px; flex-wrap:wrap; margin-top:14px}
  .nums div{font-size:13px; color:var(--muted)}
  .nums b{display:block; font-size:22px; line-height:1.2; color:var(--ink); font-variant-numeric:tabular-nums}
  h2.sec{margin:22px 0 8px; font-size:15px; font-weight:700; color:var(--muted)}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px}
  .stat-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px}
  .stat-top strong{font-size:17px}
  .stat-top span{font-weight:700; font-variant-numeric:tabular-nums}
  .stat .sub{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; font-size:13px; color:var(--muted)}
  .stat .warn{background:var(--flag); color:var(--flag-ink); font-weight:700; padding:1px 8px; border-radius:4px}
  .fine{font-size:13px; color:var(--muted); margin:16px 0 0}
  .tabs:empty{display:none}
  .overlay{position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(8,16,24,.6)}
  .overlay[hidden]{display:none}
  #owner-err{margin:12px 0 0; color:var(--bad); font-weight:600; min-height:1.4em}
  :root{--sp:#E7DAF5; --sp-ink:#3B1A63}
  @media (prefers-color-scheme:dark){:root{--sp:#3A2B55; --sp-ink:#E3D3FA}}
  .tagsp{display:inline-block; background:var(--sp); color:var(--sp-ink); font-size:13px; font-weight:800; padding:2px 8px; border-radius:4px; margin-bottom:3px}
  .owner-lock{margin-top:18px}
  .leftlist{margin-top:10px; border-top:1px solid var(--line); padding-top:4px}
  .leftlist summary{min-height:40px; display:flex; align-items:center; cursor:pointer; font-weight:650; color:var(--brand)}
  .leftlist ul{list-style:none; margin:2px 0 0; padding:0}
  .leftlist li{display:flex; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:15px}
  .leftlist li:last-child{border-bottom:0}
  .ld{flex:none; width:88px; color:var(--muted); font-variant-numeric:tabular-nums}
  .stat-hero .asof{font-size:13px; margin:-6px 0 12px}
  .leftlist .was{display:block}
  .weekbar{display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; margin:10px 0 4px}
  .weeklabel{text-align:center; line-height:1.3}
  .weeklabel strong{display:block; font-size:17px}
  .weeklabel span{display:block; font-size:13px; color:var(--muted)}
  .linkbtn{background:transparent; border:0; color:var(--brand); font-weight:650; min-height:32px; padding:0 8px; text-decoration:underline}
  .btn:disabled{opacity:.4; cursor:default}
</style>
</head>
<body>
<section id="gate" hidden>
  <form class="gate-box" id="gate-form" autocomplete="off">
    <h1 id="gate-title">Plan</h1>
    <p>Enter the team passcode to open the plan.</p>
    <label for="code">Passcode</label>
    <input id="code" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="go">
    <button class="btn primary" type="submit">Open plan</button>
    <p id="gate-err" role="alert"></p>
  </form>
</section>
<section id="owner-box" class="overlay" hidden>
  <form class="gate-box" id="owner-form" autocomplete="off">
    <h1>Owner access</h1>
    <label for="owner-code">Owner passcode</label>
    <input id="owner-code" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="go">
    <button class="btn primary" type="submit">Unlock</button>
    <button class="btn" type="button" id="owner-cancel" style="margin-top:8px">Cancel</button>
    <p id="owner-err" role="alert"></p>
  </form>
</section>
<header>
  <div class="bar">
    <div>
      <h1 id="title">Q4 measurements plan</h1>
      <p id="status" role="status" aria-live="polite">Loading…</p>
    </div>
    <button class="btn" id="refresh" type="button">Refresh</button>
  </div>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Sections"></nav>
  <nav id="pills" aria-label="Teams"></nav>
</header>
<main>
  <div id="preview"></div>
  <div id="banner"></div>
  <div id="tools"></div>
  <div id="list"></div>
  <noscript><p class="empty">This page needs JavaScript to show the plan.</p></noscript>
</main>

<script src="settings.js"></script>
<script>
/* ============================================================
   Default settings. Your own settings (sheet link, passcode, zone
   totals) live in the separate file settings.js, so you can replace
   this page with a newer version without losing them.
   ============================================================ */
const DEFAULTS = {
  title: "Q4 measurements plan",
  sheetUrl: "",
  passcode: "",
  ownerPasscode: "",
  zoneTargets: { Giza: 12, Alex: 10, Cairo: 22, Upper: 38, Delta: 33, Canal: 12 },
  dateColumn: 0,
  ignoreColumns: [],
  refreshMinutes: 5,
  weekStart: 0          // first day of a week: 0 = Sunday, 6 = Saturday
};
const CONFIG = Object.assign({}, DEFAULTS, window.PLAN_SETTINGS || {});
/* ============================================================ */

function sampleCSV(){
  const rows = [',,Team A,Team B,Team C'], regions = ['Cairo','Giza','Alex','Delta','Upper','Canal'], base = new Date();
  for(let i = 0; i < 14; i++){
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i), dow = d.getDay();
    const label = d.getDate() + '-' + d.toLocaleDateString('en', {month:'short'}) + '-' + String(d.getFullYear()).slice(2);
    const wk = d.toLocaleDateString('en', {weekday:'long'});
    if(dow === 5 || dow === 6){ rows.push(label + ',' + wk + ',,,'); continue; }
    const cell = n => regions[(i + n) % 6] + '_0' + ((i + n) % 9 + 1) + '_' + String(100 + i * 3 + n).padStart(3, '0') + '_Sample site ' + (i * 3 + n + 1);
    rows.push([label, wk, cell(0), i % 4 === 1 ? 'Travel to sample city' : cell(1), i % 5 === 2 ? 'OFF' : cell(2)].join(','));
  }
  return rows.join('\n');
}

(function(){
'use strict';
const C = CONFIG, ALL = '*';
const $ = s => document.querySelector(s);
const preview = !C.sheetUrl;
const REGION = {Alex:'Alexandria', Upper:'Upper Egypt'};

const LS = {
  get(k, d){ try{ const v = localStorage.getItem('qp:'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('qp:'+k, JSON.stringify(v)); }catch(e){} }
};
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k]; if(v == null || v === false) continue;
    if(k === 'class') n.className = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if(c == null || c === false) return; n.append(c.nodeType ? c : document.createTextNode(c)); });
  return n;
}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const key = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function todayKey(){ const d = new Date(); return key(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
function dateKey(s){
  s = String(s || '').trim(); if(!s) return null; let m;
  if((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return key(+m[1], +m[2], +m[3]);
  if((m = s.match(/^(\d{1,2})[-\/ .]([A-Za-z]{3,})[-\/ .,]*(\d{2,4})/)) && MON[m[2].slice(0,3).toLowerCase()]){
    let y = +m[3]; if(y < 100) y += 2000; return key(y, MON[m[2].slice(0,3).toLowerCase()], +m[1]);
  }
  if((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){
    let a = +m[1], b = +m[2], y = +m[3]; if(y < 100) y += 2000;
    return b > 12 && a <= 12 ? key(y, a, b) : key(y, b, a);
  }
  return null;
}
const dObj = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const wd  = k => dObj(k).toLocaleDateString([], {weekday:'short'});
const mo  = k => dObj(k).toLocaleDateString([], {month:'short'});
const dn  = k => +k.slice(8);
const short = k => `${wd(k)} ${dn(k)} ${mo(k)}`;
const monthLabel = k => dObj(k).toLocaleDateString([], {month:'long', year:'numeric'});
const addDays = (k, n) => { const x = dObj(k), e = new Date(x.getFullYear(), x.getMonth(), x.getDate() + n); return key(e.getFullYear(), e.getMonth() + 1, e.getDate()); };
const weekStartOf = k => addDays(k, -((dObj(k).getDay() - C.weekStart + 7) % 7));
const rangeLabel = (a, b) => mo(a) === mo(b) ? `${dn(a)} – ${dn(b)} ${mo(a)}` : `${dn(a)} ${mo(a)} – ${dn(b)} ${mo(b)}`;
const fmtTime = ts => new Date(ts).toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});

/* ---------- CSV → plan ---------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true;
    else if(ch === ','){ row.push(cell); cell = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i+1] === '\n') i++; row.push(cell); cell = ''; rows.push(row); row = []; }
    else cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function planFromCSV(text){
  const grid = parseCSV(text).filter(r => r.some(c => c.trim() !== ''));
  if(grid.length < 2) throw new Error('The sheet is empty');
  const head = grid[0].map(h => h.trim()), di = C.dateColumn;
  const skip = new Set(C.ignoreColumns.map(s => s.toLowerCase()));
  const cols = head.map((h, i) => ({h, i})).filter(c => c.h && c.i !== di && !skip.has(c.h.toLowerCase()) && !/^(day|weekday|date)$/i.test(c.h));
  if(!cols.length) throw new Error('No team names were found in the first row of the sheet');
  const days = [];
  grid.slice(1).forEach(r => {
    const k = dateKey(r[di]); if(!k) return;
    const cells = {}; cols.forEach(c => cells[c.h] = (r[c.i] || '').replace(/\s+/g, ' ').trim());
    days.push({key:k, cells});
  });
  if(!days.length) throw new Error('No dates were found in the date column');
  days.sort((a, b) => a.key < b.key ? -1 : a.key > b.key ? 1 : 0);
  return {teams: cols.map(c => c.h), days};
}
async function fetchPlan(){
  if(preview) return planFromCSV(sampleCSV());
  const u = C.sheetUrl + (C.sheetUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
  const res = await fetch(u, {cache:'no-store'});
  if(!res.ok) throw new Error('The sheet answered with HTTP ' + res.status);
  return planFromCSV(await res.text());
}

/* ---------- change tracking (per team, by date) ---------- */
function snapshot(team){
  const s = {}; data.days.forEach(d => s[d.key] = d.cells[team] || '');
  LS.set('seen:' + team, s);
}
function seedSnapshots(){
  data.teams.forEach((t, i) => {
    if(LS.get('seen:' + t, null)) return;
    snapshot(t);
    if(preview && i === 0){ // preview only: pretend one upcoming day was different, so the highlight can be seen
      const s = LS.get('seen:' + t, {}), today = todayKey();
      const d = data.days.find(x => x.key >= today && x.cells[t] && /_/.test(x.cells[t]) && x.key > today);
      if(d){ s[d.key] = 'Cairo_01_000_Previous site'; LS.set('seen:' + t, s); }
    }
  });
}
function changesFor(team){
  const seen = LS.get('seen:' + team, null), out = {}, today = todayKey();
  if(!seen) return out;
  data.days.forEach(d => { if(d.key >= today && (d.cells[team] || '') !== (seen[d.key] || '')) out[d.key] = seen[d.key] || ''; });
  return out;
}

/* ---------- state ---------- */
let data = null, error = '', online = true, loadedAt = 0;
let weekKey = null, page = LS.get('page', 'plan'), sel = LS.get('sel', ''), view = LS.get('view', 'upcoming'), scrollToday = false;

function setStatus(text, bad){ const s = $('#status'); s.textContent = text; s.className = bad ? 'offline' : ''; }
async function refresh(){
  if(locked) return;
  setStatus('Updating…');
  try{
    data = await fetchPlan(); online = true; error = ''; loadedAt = Date.now();
    data.fetchedAt = loadedAt; if(!preview) LS.set('cache', data);
  }catch(e){
    const c = preview ? null : LS.get('cache', null);
    if(c){ data = c; online = false; } else { data = null; error = e.message || 'Unknown error'; }
  }
  if(data) seedSnapshots();
  render();
}

/* ---------- rendering ---------- */
function items(text, today){
  const wrap = el('div', {class:'items'});
  text.split(/\s+\+\s+/).forEach(p => {
    p = p.trim(); if(!p) return;
    const sp = p.match(/^special[\s_:\-–—.]*(.*)$/i);
    if(sp) wrap.append(el('div', {class:'site'}, el('span', {class:'tagsp'}, 'Special'), el('strong', null, sp[1].trim() || 'Special measurement')));
    else if(/^off$/i.test(p)) wrap.append(el('span', {class:'chip off'}, 'Off'));
    else if(/holiday/i.test(p)) wrap.append(el('span', {class:'chip off'}, p));
    else if(/^(travel|back)\b/i.test(p)) wrap.append(el('span', {class:'chip trip'}, p));
    else {
      const m = p.match(/^([A-Za-z]+)_(?:(\d+)_(\d+)_)?(.+)$/);
      if(m) wrap.append(el('div', {class:'site'}, el('strong', null, m[4].trim()),
        el('span', {class:'meta'}, REGION[m[1]] || m[1]), m[3] && el('span', {class:'meta'}, 'Site ' + m[3])));
      else wrap.append(el('div', {class:'note'}, p));
    }
  });
  return wrap;
}

/* ---------- statistics (global, all teams together) ---------- */
const zoneRegion = name => (Object.keys(C.zoneTargets || {}).find(r => r.toLowerCase() === name.toLowerCase())) || name;
function computeStats(){
  const today = todayKey(), zones = new Map(), special = {total: 0, done: 0, today: 0};
  data.days.forEach(d => data.teams.forEach(t => {
    (d.cells[t] || '').split(/\s+\+\s+/).forEach(p => {
      p = p.trim();
      if(/^special/i.test(p)){ // special measurements are counted per entry, separately from the zones
        special.total++; if(d.key < today) special.done++; else if(d.key === today) special.today++; return;
      }
      const m = p.match(/^([A-Za-z]+)_/);
      if(!m || /^(travel|back|off)\b/i.test(p) || /holiday/i.test(p)) return;
      const k = p.toLowerCase();
      const z = zones.get(k);
      if(!z){
        const pm = p.match(/^[A-Za-z]+_(?:(\d+)_(\d+)_)?(.+)$/);
        zones.set(k, {region: zoneRegion(m[1]), dates: [d.key], name: pm ? pm[3].trim() : p, id: pm && pm[2] ? pm[2] : ''});
      } else if(!z.dates.includes(d.key)) z.dates.push(d.key);
    });
  }));
  const targets = C.zoneTargets || {}, regions = {};
  const blank = target => ({target, planned: 0, done: 0, today: 0, left: []});
  Object.keys(targets).forEach(r => regions[r] = blank(targets[r]));
  let replanned = 0;
  zones.forEach(z => {
    z.dates.sort(); z.when = z.dates[z.dates.length - 1]; z.earlier = z.dates.slice(0, -1); // the latest planned date is the one that counts
    if(z.earlier.length) replanned++;
    const r = regions[z.region] || (regions[z.region] = blank(null));
    r.planned++;
    if(z.when < today) r.done++; else { if(z.when === today) r.today++; r.left.push(z); }
  });
  Object.values(regions).forEach(r => r.left.sort((a, b) => a.when < b.when ? -1 : a.when > b.when ? 1 : 0));
  const last = data.days.filter(d => data.teams.some(t => d.cells[t])).map(d => d.key).pop();
  return {regions, last, special, replanned};
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const meter = (done, base, label) => el('div', {class:'meter', role:'progressbar', 'aria-label':label,
  'aria-valuemin':'0', 'aria-valuemax':String(base), 'aria-valuenow':String(done)}, el('span', {style:'width:' + pct(done, base) + '%'}));
function renderStats(list){
  const s = computeStats(), regionName = r => REGION[r] || r;
  const baseOf = r => Math.max(r.target || 0, r.planned);
  const vals = Object.values(s.regions);
  const total = vals.reduce((a, r) => a + baseOf(r), 0);
  const done = vals.reduce((a, r) => a + r.done, 0), tod = vals.reduce((a, r) => a + r.today, 0);
  const planned = vals.reduce((a, r) => a + r.planned, 0);
  const unplanned = vals.reduce((a, r) => a + Math.max(0, (r.target || 0) - r.planned), 0);
  list.append(el('section', {class:'stat-hero'},
    el('div', {class:'big'}, done, el('small', null, ' of ' + total + ' zones done')),
    el('p', null, pct(done, total) + '% complete. ' + (total - done) + ' left to measure.'),
    el('p', {class:'asof'}, 'As of today, ' + short(todayKey()) + ': every zone planned before today counts as measured.'),
    meter(done, total, 'Overall progress'),
    el('div', {class:'nums'},
      el('div', null, el('b', null, tod), 'Today'),
      el('div', null, el('b', null, planned - done - tod), 'Planned ahead'),
      el('div', null, el('b', null, unplanned), 'Not planned yet'))));
  list.append(el('h2', {class:'sec'}, 'By region'));
  Object.entries(s.regions).forEach(([r, v]) => {
    const base = baseOf(v), unp = Math.max(0, (v.target || 0) - v.planned);
    list.append(el('div', {class:'stat'},
      el('div', {class:'stat-top'}, el('strong', null, regionName(r)), el('span', null, v.done + ' / ' + base)),
      meter(v.done, base, regionName(r) + ' progress'),
      el('div', {class:'sub'},
        el('span', null, v.left.length + ' left'),
        v.today > 0 && el('span', null, v.today + ' of them today'),
        unp > 0 && el('span', {class:'warn'}, unp + ' not planned yet'),
        v.target != null && v.planned > v.target && el('span', {class:'warn'}, (v.planned - v.target) + ' more than the target'),
        v.left.length === 0 && unp === 0 && v.planned > 0 && el('span', null, 'All done')),
      v.left.length > 0 && el('details', {class:'leftlist'},
        el('summary', null, 'Show the ' + v.left.length + ' left'),
        el('ul', null, v.left.map(z => el('li', null, el('span', {class:'ld'}, short(z.when)),
          el('span', null, z.name + (z.id ? ' (site ' + z.id + ')' : ''),
            z.earlier.length > 0 && el('small', {class:'was'}, ' also planned ' + z.earlier.map(short).join(', ')))))))));
  });
  list.append(el('h2', {class:'sec'}, 'Special measurements'));
  const sp = s.special;
  list.append(sp.total === 0
    ? el('div', {class:'stat'}, el('div', {class:'none'}, 'None planned yet. Entries that start with “Special” are counted here.'))
    : el('div', {class:'stat'},
        el('div', {class:'stat-top'}, el('strong', null, 'All special requests'), el('span', null, sp.total + ' planned')),
        el('div', {class:'sub'}, el('span', null, sp.done + ' done'), sp.today > 0 && el('span', null, sp.today + ' today'),
          el('span', null, (sp.total - sp.done - sp.today) + ' planned ahead'))));
  list.append(el('p', {class:'fine'}, 'A zone counts as done once its planned date has passed, because the sheet does not record whether a visit was really completed. If you change a zone’s date in the sheet, the numbers follow it. If a zone appears on more than one date, the latest date counts' + (s.replanned ? ' (' + s.replanned + ' do now)' : '') + '. “Not planned yet” is the required number of zones minus the zones found in the plan; the page cannot say which zones they are because it has no master list. Special measurements are counted separately.'
    + (s.last ? ' Last planned visit: ' + short(s.last) + '.' : '')));
  list.append(el('button', {class:'btn owner-lock', type:'button', onclick: () => {
    LS.set('owner', ''); page = 'plan'; LS.set('page', 'plan'); render(); }}, 'Lock owner view'));
}

function render(){
  $('#title').textContent = C.title; document.title = C.title;
  const pills = $('#pills'), list = $('#list'), banner = $('#banner'), tools = $('#tools');
  [pills, list, banner, tools].forEach(n => n.replaceChildren());
  $('#preview').replaceChildren(preview ? el('p', {class:'preview'},
    'Preview: this is sample data, not your plan. Add your Google Sheet link in the settings at the top of this file.') : '');

  if(!data){
    setStatus('Could not load the plan', true);
    list.append(el('div', {class:'empty'}, el('strong', null, 'The plan did not load'),
      error + '. Check your internet connection and the sheet link, then try again.'));
    return;
  }
  setStatus(online ? 'Updated ' + fmtTime(data.fetchedAt) : 'Offline – showing the copy saved on ' + fmtTime(data.fetchedAt), !online);
  if(page === 'stats' && !isOwner()) page = 'plan';
  $('#tabs').replaceChildren(...(isOwner() ? [['plan', 'Plan'], ['stats', 'Statistics']] : []).map(([v, label]) =>
    el('button', {type:'button', class:'tab', role:'tab', 'aria-selected': String(page === v),
      onclick: () => { page = v; LS.set('page', v); render(); }}, label)));
  if(page === 'stats'){ renderStats(list); return; }
  if(sel !== ALL && !data.teams.includes(sel)) sel = data.teams[0];

  const chg = {}; data.teams.forEach(t => chg[t] = changesFor(t));
  const count = t => Object.keys(chg[t]).length;
  const scope = sel === ALL ? data.teams : [sel];
  const allDates = new Set(); data.teams.forEach(t => Object.keys(chg[t]).forEach(k => allDates.add(k)));

  const pick = v => { sel = v; LS.set('sel', v); render(); };
  pills.append(el('button', {type:'button', class:'pill', 'aria-pressed': String(sel === ALL), onclick: () => pick(ALL)},
    'All teams', allDates.size > 0 && el('span', {class:'dot', 'aria-label': allDates.size + ' changed days'}, allDates.size)));
  data.teams.forEach(t => pills.append(el('button', {type:'button', class:'pill', 'aria-pressed': String(t === sel), onclick: () => pick(t)},
    t, count(t) > 0 && el('span', {class:'dot', 'aria-label': count(t) + ' changed days'}, count(t)))));

  const scopeDates = new Set(); scope.forEach(t => Object.keys(chg[t]).forEach(k => scopeDates.add(k)));
  if(scopeDates.size){
    const dates = [...scopeDates].sort(), n = dates.length;
    banner.append(el('div', {class:'notice'},
      el('p', null, `${n} ${n === 1 ? 'day has' : 'days have'} changed since you last checked.`,
        el('small', null, dates.slice(0, 5).map(short).join(', ') + (n > 5 ? ' and more' : ''))),
      el('button', {class:'btn primary', type:'button', onclick: () => { scope.forEach(snapshot); render(); }}, 'Mark as seen')));
  }

  tools.append(el('div', {class:'seg', role:'group', 'aria-label':'Range'},
    [['upcoming', 'From today'], ['week', 'By week'], ['all', 'Whole plan']].map(([v, label]) => el('button', {type:'button', 'aria-pressed': String(view === v),
      onclick: () => { view = v; LS.set('view', v); scrollToday = v === 'all'; weekKey = null; render(); }}, label))));

  const today = todayKey();
  const firstKey = data.days[0].key, lastKey = data.days[data.days.length - 1].key;
  let days;
  if(view === 'week'){
    const base = weekKey || (today > lastKey ? lastKey : today < firstKey ? firstKey : today);
    const ws = weekStartOf(base), we = addDays(ws, 6);
    days = data.days.filter(d => d.key >= ws && d.key <= we);
    let z = 0, sp = 0;
    days.forEach(d => scope.forEach(t => (d.cells[t] || '').split(/\s+\+\s+/).forEach(p => {
      p = p.trim();
      if(/^special/i.test(p)) sp++;
      else if(/^[A-Za-z]+_/.test(p) && !/^(travel|back|off)\b/i.test(p) && !/holiday/i.test(p)) z++;
    })));
    tools.append(el('div', {class:'weekbar'},
      el('button', {class:'btn', type:'button', 'aria-label':'Previous week', disabled: ws <= weekStartOf(firstKey) ? 'disabled' : null,
        onclick: () => { weekKey = addDays(ws, -7); render(); }}, '‹ Prev'),
      el('div', {class:'weeklabel'}, el('strong', null, rangeLabel(ws, we)),
        el('span', null, z + (z === 1 ? ' zone' : ' zones') + (sp ? ', ' + sp + ' special' : '')),
        ws !== weekStartOf(today) && el('button', {class:'linkbtn', type:'button', onclick: () => { weekKey = null; render(); }}, 'Go to this week')),
      el('button', {class:'btn', type:'button', 'aria-label':'Next week', disabled: we >= lastKey ? 'disabled' : null,
        onclick: () => { weekKey = addDays(ws, 7); render(); }}, 'Next ›')));
  } else days = data.days.filter(d => view === 'all' || d.key >= today);
  if(!days.length){
    list.append(el('div', {class:'empty'}, el('strong', null, 'The plan has ended'), 'There are no days left in this plan.',
      el('div', null, el('button', {class:'btn', type:'button', onclick: () => { view = 'all'; LS.set('view', 'all'); render(); }}, 'Show the whole plan'))));
    return;
  }

  const showTeams = d => scope.filter(t => d.cells[t] || (d.key in chg[t]));
  let month = '', run = [];
  const ensureMonth = k => { const m = k.slice(0, 7); if(m !== month){ month = m; list.append(el('h2', {class:'month'}, monthLabel(k))); } };
  const flush = () => {
    if(!run.length) return;
    ensureMonth(run[0].key);
    const a = run[0].key, b = run[run.length - 1].key;
    list.append(el('p', {class:'gap'}, run.length === 1 ? `No plan for ${short(a)}` : `No plan from ${short(a)} to ${short(b)}`));
    run = [];
  };

  days.forEach(d => {
    const isToday = d.key === today, shown = showTeams(d);
    if(!shown.length && !isToday){ run.push(d); return; }
    flush(); ensureMonth(d.key);
    const flagged = shown.some(t => d.key in chg[t]);
    const body = el('div');
    if(!shown.length) body.append(el('div', {class:'none'}, 'Nothing planned today.'));
    shown.forEach(t => {
      const text = d.cells[t] || '', was = chg[t][d.key], isChg = d.key in chg[t];
      body.append(el('div', {class:'row'},
        sel === ALL && el('div', {class:'who'}, t),
        text ? items(text) : el('div', {class:'none'}, 'No plan'),
        isChg && el('div', {class:'flagline'}, el('span', {class:'tag'}, was ? 'Changed' : 'New'),
          was && el('span', {class:'was'}, 'was: ' + was))));
    });
    list.append(el('article', {class:'day' + (isToday ? ' today' : '') + (flagged ? ' changed' : '') + (d.key < today ? ' past' : ''),
      'aria-current': isToday ? 'date' : null},
      el('div', {class:'when'}, el('span', {class:'wd'}, isToday ? 'Today' : wd(d.key)), el('span', {class:'num'}, dn(d.key)), el('span', {class:'mo'}, mo(d.key))),
      body));
  });
  flush();

  const on = pills.querySelector('[aria-pressed="true"]');
  if(on && on.scrollIntoView) on.scrollIntoView({inline:'center', block:'nearest'});
  if(scrollToday){ scrollToday = false; const t = document.querySelector('[aria-current="date"]'); if(t) t.scrollIntoView({block:'center'}); }
}

/* ---------- passcode screen ---------- */
let locked = !!C.passcode && LS.get('unlock', '') !== C.passcode;
const gate = $('#gate'), codeInput = $('#code'), gateErr = $('#gate-err');
function showGate(){
  document.body.classList.add('locked'); gate.hidden = false;
  $('#gate-title').textContent = C.title;
  setTimeout(() => codeInput.focus(), 50);
}
$('#gate-form').addEventListener('submit', e => {
  e.preventDefault();
  if(codeInput.value.trim() === C.passcode){
    LS.set('unlock', C.passcode); locked = false; gate.hidden = true; gateErr.textContent = '';
    document.body.classList.remove('locked'); refresh();
  } else { gateErr.textContent = 'That passcode is not correct. Try again.'; codeInput.select(); }
});

/* ---------- owner access (Statistics tab) ---------- */
const isOwner = () => !!C.ownerPasscode && LS.get('owner', '') === C.ownerPasscode;
const ownerBox = $('#owner-box'), ownerInput = $('#owner-code'), ownerErr = $('#owner-err');
function openOwnerBox(){
  if(!C.ownerPasscode) return;
  ownerErr.textContent = ''; ownerInput.value = ''; ownerBox.hidden = false; setTimeout(() => ownerInput.focus(), 50);
}
$('#owner-cancel').addEventListener('click', () => { ownerBox.hidden = true; });
$('#owner-form').addEventListener('submit', e => {
  e.preventDefault();
  if(ownerInput.value.trim() === C.ownerPasscode){
    LS.set('owner', C.ownerPasscode); ownerBox.hidden = true; page = 'stats'; LS.set('page', 'stats'); if(data) render();
  } else { ownerErr.textContent = 'That passcode is not correct.'; ownerInput.select(); }
});
let taps = [];
$('#title').addEventListener('click', () => {            // tap the title 5 times quickly to open owner access
  const n = Date.now(); taps = taps.filter(x => n - x < 4000); taps.push(n);
  if(taps.length >= 5){ taps = []; openOwnerBox(); }
});
if(typeof location !== 'undefined' && /(^|[?&#])owner\b/.test(location.search + location.hash)) openOwnerBox();

/* ---------- wiring ---------- */
$('#refresh').addEventListener('click', refresh);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && Date.now() - loadedAt > 60000) refresh(); });
setInterval(refresh, Math.max(1, C.refreshMinutes) * 60000);
window.addEventListener('online', refresh);
if(locked) showGate(); else refresh();
})();
</script>
